# Pipeline del laboratorio
# =================================
# Tres etapas, porque enseñan cosas distintas:
#
#   verificar      corre en CADA pull request y en cada push a main.
#                  Si falla, GitHub bloquea la fusión. Es el "no" del sistema.
#
#   vista-previa   solo en pull requests. Publica el cambio en una URL temporal
#                  y la comenta en el PR. El autor ve SU cambio antes de fusionar.
#
#   publicar       solo al fusionar en main. Va al sitio real.
#                  Nadie sube archivos a mano, nunca. Los despliegues están
#                  serializados (concurrency, más abajo): si dos personas
#                  fusionan casi al mismo tiempo, el segundo deploy espera a
#                  que termine el primero en vez de pisarlo.
#
# Configuración necesaria, una sola vez:
#   1) firebase init hosting:github — ya hecho. Creó el secret
#      FIREBASE_SERVICE_ACCOUNT_HOUSTON_LAB_ECAFD y un workflow propio que
#      se eliminó: desplegaba dist/ sin construirlo antes.
#   2) Settings → Branches → Add rule → main
#        · Require a pull request before merging
#        · Require status checks to pass → Verificar
#      (activar recién cuando el contenido esté listo)

name: Verificar y publicar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FIREBASE_PROJECT: houston-lab-ecafd

jobs:
  verificar:
    name: Verificar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Construir
        run: node build.mjs

      - name: Validar la presentación
        run: node test/validar.mjs

  vista-previa:
    name: Vista previa del cambio
    needs: verificar
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Construir
        run: node build.mjs

      - name: Publicar en una URL temporal
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HOUSTON_LAB_ECAFD }}
          projectId: ${{ env.FIREBASE_PROJECT }}
          expires: 7d

  publicar:
    name: Publicar
    needs: verificar
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: publicar-produccion
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Construir
        run: node build.mjs

      - name: Publicar en el sitio real
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HOUSTON_LAB_ECAFD }}
          projectId: ${{ env.FIREBASE_PROJECT }}
          channelId: live
