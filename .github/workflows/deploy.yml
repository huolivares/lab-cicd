# Pipeline del laboratorio
# =================================
# Dos etapas, porque enseñan cosas distintas:
#
#   verificar      corre en CADA pull request y en cada push a main.
#                  Si falla, GitHub bloquea la fusión. Es el "no" del sistema.
#
#   publicar       solo al fusionar en main. Va al sitio real.
#                  Nadie sube archivos a mano, nunca. Los despliegues están
#                  serializados (concurrency, más abajo): si dos personas
#                  fusionan casi al mismo tiempo, el segundo deploy espera a
#                  que termine el primero en vez de pisarlo.
#
# La imagen se construye una sola vez, al fusionar, etiquetada con el hash
# del commit — la misma idea que el marcador de versión de la presentación
# y que revertir con "git revert": un solo identificador para "qué código es
# este" en todo el pipeline. Por eso no hay un job de vista previa aparte
# desplegando su propia imagen: evita el problema de tener dos "docker build"
# del mismo cambio en momentos distintos, que podrían traer una versión más
# nueva de node:20-alpine o nginx:alpine y terminar publicando algo que nadie
# probó exactamente igual.
#
# Configuración necesaria, una sola vez (ver README, sección "Configuración
# en Google Cloud"): repositorio en Artifact Registry, servicio de Cloud Run,
# cuenta de servicio con permisos mínimos, y Workload Identity Federation
# para que este workflow se autentique sin guardar ninguna llave.

name: Verificar y publicar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GCP_PROJECT: TU_PROYECTO_GCP
  GCP_REGION: southamerica-west1
  SERVICIO: lab-cicd
  IMAGEN: southamerica-west1-docker.pkg.dev/TU_PROYECTO_GCP/lab-cicd/sitio

jobs:
  verificar:
    name: Verificar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Construir
        run: node build.mjs

      - name: Validar la presentación
        run: node test/validar.mjs

  publicar:
    name: Publicar
    needs: verificar
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: publicar-produccion
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: Autenticarse en Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Autenticar Docker con Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Construir y subir la imagen
        run: |
          docker build --build-arg GITHUB_SHA=${{ github.sha }} -t ${{ env.IMAGEN }}:${{ github.sha }} .
          docker push ${{ env.IMAGEN }}:${{ github.sha }}

      - name: Publicar en el sitio real
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICIO }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.IMAGEN }}:${{ github.sha }}
