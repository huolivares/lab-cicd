# docker.yml — construir y publicar la imagen a GitHub Container Registry.
#
# Es el mismo "construir → publicar" que deploy.yml, pero el artefacto es
# una imagen de contenedor en vez de archivos sueltos en un hosting estático.
# Corre en paralelo a deploy.yml, no lo reemplaza: el sitio real lo sigue
# publicando Firebase Hosting.
#
#   pull request   construye la imagen para confirmar que el Dockerfile
#                  sigue sano, pero no la publica (no hay login en PRs).
#   push a main    construye y publica en:
#                    ghcr.io/<owner>/<repo>:latest
#                    ghcr.io/<owner>/<repo>:<sha>
#
# GHCR es gratis para repos públicos y usa el GITHUB_TOKEN que ya trae el
# repo: no hay que crear ni guardar ningún secret nuevo.
#
# Lo que este workflow NO hace: desplegar la imagen a un servidor de prod.
# Ese último paso depende de la infraestructura de cada equipo — típicamente
# un job que se conecta por SSH al servidor y corre
#   docker compose pull && docker compose up -d
# usando la imagen recién publicada.

name: Construir y publicar imagen

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGEN: ghcr.io/${{ github.repository }}

jobs:
  build-imagen:
    name: Construir imagen
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Iniciar sesión en GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGEN }}:latest
            ${{ env.IMAGEN }}:${{ github.sha }}
